# Every push that changes a font (fonts/*.ttf) gets a build number: fonts/version.json (the date of the last change per font) and the tag fonts-<N>, whose message names the fonts that changed.
# jsDelivr serves a tag unchanged for ever (cdn.jsdelivr.net/gh/qtng/cdn@fonts-<N>/fonts/...), so a font address with the tag never needs a purge.
name: version
on:
  push:
    branches: [main]
    paths: ['fonts/**', '.github/scripts/make_version.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: version
jobs:
  version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the dates of the fonts come from the history
      - name: version.json, tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(python3 .github/scripts/make_version.py); code=$?
          set -e
          [ $code -eq 3 ] && { echo "no font changed"; exit 0; }
          [ $code -eq 0 ] || exit $code
          build=${out%% *}; names=${out#* }
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/version.json
          git commit -m "Fonts: build $build ($names)"
          git tag -a "fonts-$build" -m "Fonts, build $build: $names"
          git push origin HEAD:main "fonts-$build"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true   # a push with the token starts no workflow: ask Pages for a build
